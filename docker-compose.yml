# Hardened production stack:
#   Internet → (optional Cloudflare / provider DDoS protection) → Caddy (TLS 1.2+/1.3, HSTS) → 2× QChat → Postgres + Redis
# Only Caddy (80/443) and coturn are reachable from outside; the database and Redis live on an internal network.
x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

x-qchat: &qchat
  <<: *hardening
  build: .
  read_only: true
  tmpfs: ["/tmp"]
  environment:
    DATABASE_URL: postgres://qchat:${POSTGRES_PASSWORD}@postgres:5432/qchat
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    TRUST_PROXY: "1"
    ALLOWED_ORIGINS: https://${DOMAIN}
    TRUSTED_IP_HEADER: ${TRUSTED_IP_HEADER:-}
    TURN_URL: turn:${DOMAIN}:3478?transport=udp,turn:${DOMAIN}:3478?transport=tcp
    TURN_SECRET: ${TURN_SECRET}
    VAPID_SUBJECT: mailto:${ADMIN_EMAIL}
    ADMIN_TOKEN: ${ADMIN_TOKEN}
    ADMIN_IPS: ${ADMIN_IPS:-}
    IP_HASH_SECRET: ${IP_HASH_SECRET}
    SECURITY_WEBHOOK_URL: ${SECURITY_WEBHOOK_URL:-}
  networks: [backend, egress]   # egress: outbound only (Web Push, alert webhook); no ports are published
  depends_on: [postgres, redis]
  deploy: { resources: { limits: { memory: 1g } } }

services:
  caddy:
    <<: *hardening
    image: caddy:2
    cap_add: ["NET_BIND_SERVICE"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks: [frontend, backend]
    depends_on: [qchat1, qchat2]
  qchat1: *qchat
  qchat2: *qchat
  postgres:
    <<: *hardening
    image: postgres:16-alpine
    cap_add: ["CHOWN", "SETUID", "SETGID", "FOWNER", "DAC_OVERRIDE"]
    environment:
      POSTGRES_USER: qchat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: qchat
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [backend]
  redis:
    <<: *hardening
    image: redis:7-alpine
    cap_add: ["SETUID", "SETGID"]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "no", "--protected-mode", "yes", "--rename-command", "FLUSHALL", "", "--rename-command", "CONFIG", ""]
    networks: [backend]
  coturn:
    <<: *hardening
    image: coturn/coturn:4.6
    cap_add: ["NET_BIND_SERVICE"]
    network_mode: host
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${DOMAIN}
    volumes:
      - ./deploy/turnserver.conf:/etc/coturn/turnserver.conf:ro

networks:
  frontend: {}
  egress: {}
  backend: { internal: true }   # database & Redis: no route to the internet, unreachable from outside
volumes:
  caddy_data: {}
  pg_data: {}
