# Hardened production stack:
#   Internet → (optional Cloudflare / provider DDoS protection) → Caddy (TLS 1.2+/1.3, HSTS) → 2× QChat → chat DB + admin DB + Redis
# Only Caddy (80/443) and coturn are reachable from outside. The two databases are separate Postgres servers with
# separate volumes and least-privilege roles, on an internal network with no route to the internet.
x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

x-qchat: &qchat
  <<: *hardening
  build: .
  read_only: true
  tmpfs: ["/tmp"]
  environment:
    DATABASE_URL: postgres://qchat_app:${CHAT_DB_PASSWORD}@db-chat:5432/qchat
    ADMIN_DATABASE_URL: postgres://qchat_admin:${ADMIN_DB_PASSWORD}@db-admin:5432/qchat_admin
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    TRUST_PROXY: "1"
    ALLOWED_ORIGINS: https://${DOMAIN}
    TRUSTED_IP_HEADER: ${TRUSTED_IP_HEADER:-}
    TURN_URL: turn:${DOMAIN}:3478?transport=udp,turn:${DOMAIN}:3478?transport=tcp
    TURN_SECRET: ${TURN_SECRET}
    DOMAIN: ${DOMAIN}
    ADMIN_BOOTSTRAP_USER: ${ADMIN_BOOTSTRAP_USER}
    ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD}
    ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY}
    PIN_PEPPER: ${PIN_PEPPER}
    ADMIN_IPS: ${ADMIN_IPS:-}
    IP_HASH_SECRET: ${IP_HASH_SECRET}
    SECURITY_WEBHOOK_URL: ${SECURITY_WEBHOOK_URL:-}
  networks: [backend, egress]   # egress: outbound only (Web Push, alert webhook); no ports are published
  depends_on: [db-chat, db-admin, redis]
  deploy: { resources: { limits: { memory: 1g } } }

services:
  caddy:
    <<: *hardening
    image: caddy:2
    cap_add: ["NET_BIND_SERVICE"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks: [frontend, backend]
    depends_on: [qchat1, qchat2]
  qchat1: *qchat
  qchat2: *qchat
  db-chat: &pg
    <<: *hardening
    image: postgres:16-alpine
    cap_add: ["CHOWN", "SETUID", "SETGID", "FOWNER", "DAC_OVERRIDE"]
    environment:
      POSTGRES_PASSWORD: ${CHAT_DB_SUPERUSER_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      DB_NAME: qchat
      DB_USER: qchat_app
      DB_PASSWORD: ${CHAT_DB_PASSWORD}
    volumes:
      - chat_db:/var/lib/postgresql/data
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-least-privilege.sh:ro
    command: ["postgres", "-c", "password_encryption=scram-sha-256", "-c", "log_connections=on", "-c", "log_disconnections=on", "-c", "max_connections=200"]
    networks: [backend]
  db-admin:
    <<: *pg
    environment:
      POSTGRES_PASSWORD: ${ADMIN_DB_SUPERUSER_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      DB_NAME: qchat_admin
      DB_USER: qchat_admin
      DB_PASSWORD: ${ADMIN_DB_PASSWORD}
    volumes:
      - admin_db:/var/lib/postgresql/data
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-least-privilege.sh:ro
  redis:
    <<: *hardening
    image: redis:7-alpine
    cap_add: ["SETUID", "SETGID"]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "no", "--protected-mode", "yes", "--rename-command", "FLUSHALL", "", "--rename-command", "CONFIG", ""]
    networks: [backend]
  coturn:
    <<: *hardening
    image: coturn/coturn:4.6
    cap_add: ["NET_BIND_SERVICE"]
    network_mode: host
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${DOMAIN}
    volumes:
      - ./deploy/turnserver.conf:/etc/coturn/turnserver.conf:ro

networks:
  frontend: {}
  egress: {}
  backend: { internal: true }   # database & Redis: no route to the internet, unreachable from outside
volumes:
  caddy_data: {}
  chat_db: {}
  admin_db: {}
