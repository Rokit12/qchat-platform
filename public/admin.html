<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>QChat Admin</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="admin">
  <section id="loginView" class="adm-login-wrap">
    <form id="loginForm" class="ob-card adm-login">
      <div class="ob-logo"><img src="/icon.svg" alt="" /><h1>QChat Admin</h1></div>
      <p class="muted small">Sign in with your admin account and the 6-digit code from your authenticator app. Failed attempts are logged; 5 failures lock the account for 15 minutes.</p>
      <label class="field"><span>Email or username</span><input id="lgUser" autocomplete="username" required /></label>
      <label class="field"><span>Password</span><input id="lgPass" type="password" autocomplete="current-password" required /></label>
      <div id="lgSetup" class="hidden"></div>
      <label class="field" id="lgCodeField"><span>Authenticator code <small class="muted">(leave empty on your very first sign-in)</small></span><input id="lgCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="\d{6}" class="pin-input" /></label>
      <button class="btn primary" type="submit">Sign in</button>
      <p class="error" id="lgErr"></p>
    </form>
  </section>

  <div id="appView" class="adm-shell hidden">
    <nav class="adm-nav">
      <div class="adm-brand"><img src="/icon.svg" alt="" /><b>QChat Admin</b></div>
      <button data-view="overview" class="active">📊 Overview</button>
      <button data-view="users">👥 Users</button>
      <button data-view="activity">🕒 Activity</button>
      <button data-view="security">🛡️ Security</button>
      <button data-view="status">🟢 Service status</button>
      <button data-view="audit" class="owner-only">📜 Audit log</button>
      <button data-view="admins" class="owner-only">🔑 Admins</button>
      <div class="grow"></div>
      <div class="adm-me"><span id="meName"></span><small id="meRole"></small><button class="btn" id="pwBtn">Change password</button><button class="btn" id="logoutBtn">Sign out</button></div>
    </nav>
    <main class="adm-main" id="main"></main>
  </div>

  <div id="modal" class="modal hidden"><div class="modal-card adm-modal" id="modalCard"></div></div>
  <div id="toast" class="toast hidden"></div>
  <script src="/admin/admin.js"></script>
</body>
</html>
