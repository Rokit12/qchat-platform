<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>QChat · Security dashboard</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="admin">
  <main class="adm">
    <header class="adm-head"><img src="/icon.svg" alt="" /><h1>Security dashboard</h1><span class="grow"></span><span id="admStatus" class="muted"></span></header>
    <form id="admLogin" class="ob-card adm-login">
      <h3>Admin sign-in</h3>
      <p class="muted small">Enter the server's <code>ADMIN_TOKEN</code>. Failed attempts are logged and repeated failures ban the IP.</p>
      <input type="password" id="admToken" placeholder="Admin token" autocomplete="off" />
      <button class="btn primary" type="submit">Open dashboard</button>
      <p class="error" id="admErr"></p>
    </form>
    <section id="admBody" class="hidden">
      <div class="adm-cards" id="admCards"></div>
      <div class="adm-grid">
        <div class="adm-panel"><h3>Events by type (24h)</h3><table id="admTypes"></table></div>
        <div class="adm-panel"><h3>Active IP bans</h3><table id="admBans"></table>
          <form id="admBanForm" class="row"><input id="admBanIp" placeholder="IP to ban" /><button class="btn danger" type="submit">Ban 1h</button></form></div>
      </div>
      <div class="adm-panel"><div class="row"><h3 class="grow">Security events</h3>
        <select id="admSev"><option value="">All severities</option><option value="medium">Medium+</option><option value="high" selected>High+</option><option value="critical">Critical</option></select>
        <input id="admUser" placeholder="Filter by username" /></div>
        <table class="adm-events" id="admEvents"></table></div>
    </section>
  </main>
  <script src="/admin/admin.js"></script>
</body>
</html>
